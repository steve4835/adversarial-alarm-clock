; Adversarial Alarm Clock
; PlatformIO project configuration

[env:esp32dev]
platform    = espressif32
board       = esp32dev
framework   = arduino

monitor_speed = 115200

lib_deps =
  adafruit/Adafruit LED Backpack Library
  adafruit/Adafruit GFX Library
  adafruit/RTClib

; -----------------------------------------------------------------------
; OTA upload — comment out USB block and uncomment this after first flash
; -----------------------------------------------------------------------
; upload_protocol = espota
; upload_port     = 192.168.x.x       ; replace with your clock's IP
; upload_flags    = --auth=YOUR_OTA_PASSWORD